services:
  anime-subtitle-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: anime-subtitle-worker:latest
    container_name: anime-subtitle-worker
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    runtime: nvidia
    gpus: all
    shm_size: "2gb"
    volumes:
      - ${ANIME_INPUT_HOST_PATH:-./media}:/anime
      - ${ANIME_COMPLETED_HOST_PATH:-./completed}:/completed
      - ${QBIT_SUBTITLE_HOST_PATH:-./qbit_subtitles}:/qbit_subtitle_extractor
      - ${ANIME_WORK_HOST_PATH:-./work}:/work
      - ${ANIME_LOG_HOST_PATH:-./logs}:/logs
      - ./config.yaml:/app/config.yaml:ro
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      ANIME_INPUT_PATH: /anime
      ANIME_WORK_PATH: /work
      ANIME_LOG_PATH: /logs
      ANIME_COMPLETED_PATH: /completed
      COMPLETED_DELIVERY_ENABLED: "${COMPLETED_DELIVERY_ENABLED:-false}"
      QBIT_BASE_URL: "${QBIT_BASE_URL:-http://qbittorrent.example.test}"
      QBIT_USERNAME: "${QBIT_USERNAME:-admin}"
      QBIT_PASSWORD: "${QBIT_PASSWORD:-CHANGE_ME}"
      QBIT_SAVE_PATH: "${QBIT_SAVE_PATH:-/anime}"
      QBIT_REMOTE_ANIME_PATH: "${QBIT_REMOTE_ANIME_PATH:-/anime}"
      TRANSLATOR_BASE_URL: "${TRANSLATOR_BASE_URL:-https://translator.example.test/v1}"
      TRANSLATOR_API_KEY: "${TRANSLATOR_API_KEY:-EMPTY}"
      TRANSLATOR_MODEL: "${TRANSLATOR_MODEL:-SakuraLLM:latest}"
    command: ["python", "main.py", "--config", "config.yaml", "--auto-watch"]
